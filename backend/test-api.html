<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>STM Fruit Shop - Backend API Test</h1>
    <p>This page tests if your backend API is working correctly.</p>
    
    <button onclick="testCategories()">Test Categories API</button>
    <button onclick="testProducts()">Test Products API</button>
    <button onclick="testCORS()">Test CORS</button>
    <button onclick="testAll()">Test All APIs</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://e-commerce-store-inky-nine.vercel.app/api';
        
        function addResult(message, type = 'loading') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            return div;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testCategories() {
            const result = addResult('Testing Categories API...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'test-result success';
                    result.innerHTML = `✅ Categories API Working! Found ${data.data?.length || 0} categories`;
                } else {
                    result.className = 'test-result error';
                    result.innerHTML = `❌ Categories API Failed: ${data.message || 'Unknown error'}`;
                }
            } catch (error) {
                result.className = 'test-result error';
                result.innerHTML = `❌ Categories API Error: ${error.message}`;
            }
        }
        
        async function testProducts() {
            const result = addResult('Testing Products API...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/get-product`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'test-result success';
                    result.innerHTML = `✅ Products API Working! Found ${data.data?.length || 0} products`;
                } else {
                    result.className = 'test-result error';
                    result.innerHTML = `❌ Products API Failed: ${data.message || 'Unknown error'}`;
                }
            } catch (error) {
                result.className = 'test-result error';
                result.innerHTML = `❌ Products API Error: ${error.message}`;
            }
        }
        
        async function testCORS() {
            const result = addResult('Testing CORS Configuration...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/categories`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                result.className = 'test-result success';
                result.innerHTML = `✅ CORS Working! No CORS errors detected`;
            } catch (error) {
                if (error.message.includes('CORS')) {
                    result.className = 'test-result error';
                    result.innerHTML = `❌ CORS Error: ${error.message}`;
                } else {
                    result.className = 'test-result success';
                    result.innerHTML = `✅ CORS Working! (Other error: ${error.message})`;
                }
            }
        }
        
        async function testAll() {
            clearResults();
            addResult('🚀 Starting comprehensive API test...', 'loading');
            
            await new Promise(resolve => setTimeout(resolve, 500));
            await testCORS();
            
            await new Promise(resolve => setTimeout(resolve, 500));
            await testCategories();
            
            await new Promise(resolve => setTimeout(resolve, 500));
            await testProducts();
            
            addResult('✅ All tests completed!', 'success');
        }
        
        // Auto-run basic test on page load
        window.onload = function() {
            addResult('🔍 Page loaded. Click buttons above to test APIs.', 'loading');
        };
    </script>
</body>
</html>
